<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 580">
  <!-- Main Container -->
  <rect x="0" y="30" width="440" height="550" rx="12" fill="#FFFFFF"
    filter="drop-shadow(0 2px 8px rgba(0,0,0,0.12))" />

  <!-- Header -->
  <rect x="24" y="54" width="392" height="44" rx="8" fill="#FFFFFF" />
  <text x="48" y="82" font-family="SF Pro Text" font-size="17" font-weight="500" fill="#000000">
    确认日程详情</text>

  <!-- Form Container -->
  <rect x="24" y="122" width="392" height="380" rx="8" fill="#F8F8FA" />

  <!-- Form Fields -->
  <!-- Title Field -->
  <g transform="translate(48,146)">
    <text font-family="SF Pro Text" font-size="13" fill="#86868B">标题</text>
    <rect y="20" width="344" height="44" rx="8" fill="#FFFFFF" stroke="#E5E5E5" />
    <text x="16" y="47" font-family="SF Pro Text" font-size="15" fill="#000000">南知读书会第一期</text>
  </g>

  <!-- Start Date Field -->
  <g transform="translate(48,234)">
    <text font-family="SF Pro Text" font-size="13" fill="#86868B">开始时间</text>
    <rect y="20" width="344" height="44" rx="8" fill="#FFFFFF" stroke="#E5E5E5" />
    <!-- Content Container for Vertical Center -->
    <g transform="translate(16,42)">
      <text font-family="SF Pro Text" font-size="15" fill="#007AFF" dominant-baseline="middle">11月24日
        周日 14:00</text>
      <!-- Line Icon Arrow -->
      <path transform="translate(304,0)" d="M0,-8 L8,0 L0,8 M0,0 L8,0" stroke="#666666"
        stroke-width="1.5" fill="none" />
    </g>
  </g>

  <!-- End Date Field -->
  <g transform="translate(48,322)">
    <text font-family="SF Pro Text" font-size="13" fill="#86868B">结束时间</text>
    <rect y="20" width="344" height="44" rx="8" fill="#FFFFFF" stroke="#E5E5E5" />
    <!-- Content Container for Vertical Center -->
    <g transform="translate(16,42)">
      <text font-family="SF Pro Text" font-size="15" fill="#007AFF" dominant-baseline="middle">11月24日
        周日 18:00</text>
      <!-- Line Icon Arrow -->
      <path transform="translate(304,0)" d="M0,-8 L8,0 L0,8 M0,0 L8,0" stroke="#666666"
        stroke-width="1.5" fill="none" />
    </g>
  </g>

  <!-- Location Field -->
  <g transform="translate(48,410)">
    <text font-family="SF Pro Text" font-size="13" fill="#86868B">地点</text>
    <rect y="20" width="344" height="44" rx="8" fill="#FFFFFF" stroke="#E5E5E5" />
    <!-- Content Container for Vertical Center -->
    <g transform="translate(16,42)">
      <text font-family="SF Pro Text" font-size="15" fill="#000000" dominant-baseline="middle">菜鸟云谷</text>
      <!-- Line Icon Arrow -->
      <path transform="translate(304,0)" d="M0,-8 L8,0 L0,8 M0,0 L8,0" stroke="#666666"
        stroke-width="1.5" fill="none" />
    </g>
  </g>

  <!-- Action Buttons -->
  <g transform="translate(24,526)">
    <!-- Cancel Button -->
    <rect width="190" height="44" rx="8" fill="#F5F5F5" />
    <text x="95" y="27" font-family="SF Pro Text" font-size="14" fill="#000000" text-anchor="middle">
      取消</text>

    <!-- Confirm Button -->
    <rect x="202" width="190" height="44" rx="8" fill="#007AFF" />
    <text x="297" y="27" font-family="SF Pro Text" font-size="14" fill="#FFFFFF"
      text-anchor="middle">确认</text>
  </g>
</svg>