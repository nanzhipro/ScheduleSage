<?xml version="1.0" encoding="UTF-8"?>
<svg width="440" height="543" viewBox="0 0 440 543" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景内容（与默认状态相同，但增加半透明遮罩） -->
    <g opacity="0.5">
        <!-- 复用默认状态的全部内容 -->
    </g>

    <!-- 加载遮罩 -->
    <rect width="440" height="543" fill="black" opacity="0.2" />

    <!-- Loading 指示器 -->
    <g transform="translate(220, 271.5)">
        <!-- 背景卡片 -->
        <rect x="-80" y="-60" width="160" height="120" rx="8" fill="white" filter="url(#dropShadow)" />

        <!-- 旋转环 -->
        <g>
            <circle r="20" stroke="#F2F2F7" stroke-width="4" fill="none" />
            <path d="M20 0A20 20 0 0 1 0 20" stroke="#007AFF" stroke-width="4" fill="none">
                <animateTransform attributeName="transform"
                    type="rotate"
                    from="0 0 0"
                    to="360 0 0"
                    dur="1s"
                    repeatCount="indefinite" />
            </path>
        </g>

        <!-- 加载文本 -->
        <text y="40" font-family="SF Pro Text" font-size="13" fill="#86868B" text-anchor="middle">
            正在识别文字...
        </text>
    </g>
</svg>