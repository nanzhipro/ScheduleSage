<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 448">
  <!-- Main Container -->
  <rect x="0" y="30" width="440" height="418" rx="12" fill="#FFFFFF"
    filter="drop-shadow(0 2px 8px rgba(0,0,0,0.12))" />

  <!-- Header with crown icon and status -->
  <rect x="24" y="54" width="392" height="44" rx="8" fill="#FFFFFF" />
  <g transform="translate(36,66)">
    <!-- Crown Icon -->
    <circle cx="12" cy="12" r="12" fill="#F2F2F7" />
    <path d="M6,16 L18,16 L16,10 L12,13 L8,10 L6,16" fill="none" stroke="#86868B" stroke-width="1.5" />
    <path d="M12,8 L12,9" stroke="#86868B" stroke-width="1.5" stroke-linecap="round" />

    <!-- Status Text -->
    <text x="32" y="16" font-family="SF Pro Text" font-size="13" fill="#86868B">剩余 12 次｜</text>
    <text x="112" y="16" font-family="SF Pro Text" font-size="13" fill="#007AFF">升级获取无限次数</text>
  </g>

  <!-- Add Button -->
  <circle cx="392" cy="76" r="14" fill="#007AFF" />
  <path d="M392,71 L392,81 M387,76 L397,76" stroke="#FFFFFF" stroke-width="1.5" />

  <!-- List Container -->
  <rect x="24" y="122" width="392" height="234" rx="8" fill="#F8F8FA" />

  <!-- Events Count -->
  <text x="48" y="156" font-family="SF Pro Text" font-size="13" fill="#86868B">检测到 1 个日程</text>

  <!-- Event Card -->
  <rect x="48" y="176" width="344" height="134" rx="12" fill="#FFFFFF"
    filter="drop-shadow(0 1px 2px rgba(0,0,0,0.05))" />
  <text x="68" y="208" font-family="SF Pro Text" font-size="17" font-weight="500" fill="#000000">
    南知读书会第一期</text>
  <text x="68" y="236" font-family="SF Pro Text" font-size="15" fill="#86868B">3月25日 周一 14:00-16:00</text>

  <!-- Selection Indicator -->
  <circle cx="368" cy="241" r="8" fill="#34C759" opacity="0.1" />
  <circle cx="368" cy="241" r="4" fill="#34C759" />

  <!-- Icons -->
  <g transform="translate(68,262)">
    <circle cx="12" cy="12" r="16" fill="#F2F2F7" />
    <path
      d="M12,4 C8.13,4 5,7.13 5,11 C5,16.25 12,20 12,20 C12,20 19,16.25 19,11 C19,7.13 15.87,4 12,4Z"
      fill="none" stroke="#666666" stroke-width="1.5" />

    <g transform="translate(40,0)">
      <circle cx="12" cy="12" r="16" fill="#F2F2F7" />
      <path d="M17,8 L15,10 L17,12 M7,16 L9,14 L7,12 M9,14 H15 M15,10 H9" stroke="#666666"
        fill="none" stroke-width="1.5" />
    </g>

    <g transform="translate(80,0)">
      <circle cx="12" cy="12" r="16" fill="#F2F2F7" />
      <path d="M8,6 H16 A2,2 0 0,1 18,8 V16 A2,2 0 0,1 16,18 H8 A2,2 0 0,1 6,16 V8 A2,2 0 0,1 8,6"
        fill="none" stroke="#666666" stroke-width="1.5" />
    </g>
  </g>

  <!-- Import Button -->
  <rect x="24" y="380" width="392" height="44" rx="8" fill="#007AFF" />
  <text x="220" y="407" font-family="SF Pro Text" font-size="14" fill="#FFFFFF" text-anchor="middle">
    导入到日历</text>
</svg>